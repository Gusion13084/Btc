name: 來源測試
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cp scripts/test/wrangler.jsonc wrangler.jsonc
          cp scripts/test/assetsignore .assetsignore
          npx -y wrangler@4 deploy --dry-run --outdir=/tmp/out 2>&1 | tail -30
          ls -la /tmp/out
