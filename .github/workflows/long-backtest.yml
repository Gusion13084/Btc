name: 長週期回測
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/long-backtest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: long-backtest
          path: data/long-backtest.json
