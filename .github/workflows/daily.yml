name: 每日快照與部署

on:
  schedule:
    # 主要由 Claude 排程任務每天台灣 10:07 觸發；GitHub 排程常延遲數小時，保留當作備援
    - cron: '30 2 * * *'  # 台灣 10:30 備援
    - cron: '0 6 * * *'   # 台灣 14:00 備援（補抓失敗項目）
  workflow_dispatch:       # 可在 Actions 頁面手動「Run workflow」
    inputs:
      force:
        description: '全部重新抓取（會用掉 BGeometrics 額度）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取指標並建立快照
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: node scripts/fetch.mjs ${{ inputs.force && '--force' || '' }}
      - name: 提交數據
        run: |
          git config user.name "btc-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "數據更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git push

  deploy:
    needs: snapshot
    if: always() && (needs.snapshot.result == 'success' || needs.snapshot.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 加上版本號（避免瀏覽器快取舊程式）
        run: |
          V=$(date +%s)
          sed -i "s/__V__/$V/g" index.html assets/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
