name: ETF 來源測試
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/etf-probe.mjs
      - run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git checkout --orphan etf-probe-results
          git rm -rq --cached . ; git add probe; git commit -qm "ETF 來源測試結果"; git push -f origin etf-probe-results
